version: '3.8'

services:
  risksense:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risksense-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_mock_1234567890}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-mock_secret_abcdef123456}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-webhook_secret_xyz789}
    restart: unless-stopped
